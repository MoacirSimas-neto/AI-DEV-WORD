<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Deep navy-blue background -->
  <rect width="16" height="16" fill="#0b1120" />
  <!-- Outer cyan pixel frame -->
  <rect x="1" y="2" width="14" height="1" fill="#38bdf8" />
  <rect x="1" y="13" width="14" height="1" fill="#0284c7" />
  <rect x="1" y="3" width="1" height="10" fill="#38bdf8" />
  <rect x="14" y="3" width="1" height="10" fill="#0284c7" />
  <!-- Inner dark screen -->
  <rect x="2" y="3" width="12" height="10" fill="#0f172a" />
  <!-- Top title bar strip -->
  <rect x="2" y="3" width="12" height="2" fill="#1e293b" />
  <rect x="3" y="3" width="1" height="1" fill="#38bdf8" />
  <rect x="5" y="3" width="1" height="1" fill="#7dd3fc" />
  <!-- Pixel '>' prompt -->
  <rect x="4" y="7" width="1" height="1" fill="#7dd3fc" />
  <rect x="5" y="8" width="1" height="1" fill="#38bdf8" />
  <rect x="6" y="9" width="1" height="1" fill="#38bdf8" />
  <rect x="5" y="10" width="1" height="1" fill="#38bdf8" />
  <rect x="4" y="11" width="1" height="1" fill="#7dd3fc" />
  <!-- Pixel '_' cursor -->
  <rect x="8" y="11" width="4" height="1" fill="#38bdf8" />
</svg>
