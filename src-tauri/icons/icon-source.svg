<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Deep navy-blue background -->
  <rect width="16" height="16" fill="#0b1120" />
  <!-- Bold 1px+2px high-contrast cyan frame -->
  <rect x="1" y="1" width="14" height="2" fill="#22d3ee" />
  <rect x="1" y="13" width="14" height="2" fill="#0891b2" />
  <rect x="1" y="3" width="2" height="10" fill="#22d3ee" />
  <rect x="13" y="3" width="2" height="10" fill="#0891b2" />
  <!-- Inner dark screen -->
  <rect x="3" y="3" width="10" height="10" fill="#0f172a" />
  <!-- Bold '>' prompt (2px thick, high-contrast cyan-white) -->
  <rect x="4" y="5" width="2" height="2" fill="#ecfeff" />
  <rect x="6" y="7" width="2" height="2" fill="#67e8f9" />
  <rect x="4" y="9" width="2" height="2" fill="#ecfeff" />
  <!-- Bold '_' cursor (2px thick) -->
  <rect x="8" y="10" width="4" height="2" fill="#22d3ee" />
</svg>
